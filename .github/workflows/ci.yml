name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bun run lint

      - name: Production build
        run: bun run build

      - name: API function bundle smoke test
        run: |
          VERCEL=1 NODE_ENV=production bun -e "
            import travel from './api/ai/travel-assistant.ts';
            import description from './api/ai/generate-description.ts';
            import nearby from './api/ai/nearby-attractions.ts';
            for (const [name, handler] of [['travel-assistant', travel], ['generate-description', description], ['nearby-attractions', nearby]]) {
              if (typeof handler !== 'function') throw new Error(name + ' did not export an Express handler');
            }
            console.log('All Vercel AI API entry points load the Express app.');
          "

      - name: API request smoke tests
        run: bun test tests/api-smoke.test.mjs
