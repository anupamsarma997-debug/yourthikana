name: Firestore Rules Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'tests/firestore.rules.test.mjs'
      - 'tests/subscription.rules.test.mjs'
      - '.github/workflows/firestore-rules.yml'
  push:
    branches: ['**']
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'tests/firestore.rules.test.mjs'
      - 'tests/subscription.rules.test.mjs'
      - '.github/workflows/firestore-rules.yml'

permissions:
  contents: read

jobs:
  firestore-rules:
    name: Firestore authorization tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install project dependencies
        run: bun install --frozen-lockfile
      - name: Install rules test helper
        run: npm install --no-save @firebase/rules-unit-testing@5
      - name: Run Firestore rules tests in emulator
        run: npx --yes firebase-tools@latest emulators:exec --only firestore --project demo-yourthikana --non-interactive "node --test tests/firestore.rules.test.mjs tests/subscription.rules.test.mjs"
