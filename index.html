<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Google Search Console Verification -->
    <meta name="google-site-verification" content="kwe8_trPn-zh8QfbLXj4_KsC8xl87SiC6ywtTx4Tudk" />

    <title>YourThikana | Find Hotels, Homestays, Hostels & Rooms</title>
    <meta
      name="description"
      content="Discover hotels, homestays, cottages, hostels, PGs and monthly rooms across Northeast India. Contact property hosts directly on WhatsApp through YourThikana."
    />
    <meta
      name="keywords"
      content="YourThikana, hotels Assam, homestays Northeast India, Guwahati hotels, Shillong homestays, Kaziranga stays, direct WhatsApp booking"
    />
    <link rel="canonical" href="https://mythikana.vercel.app/" />

    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mythikana.vercel.app/" />
    <meta property="og:title" content="YourThikana | Find Hotels, Homestays, Hostels & Rooms" />
    <meta
      property="og:description"
      content="Explore stays across Northeast India and contact property hosts directly on WhatsApp."
    />
    <meta
      property="og:image"
      content="https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1200&q=80"
    />
    <meta property="og:site_name" content="YourThikana" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2310b981'><path d='M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3z'/></svg>"
    />
  </head>

  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-emerald-500 selection:text-white">
    <!-- Lightweight first-paint shell: visible before the React/Firebase bundles execute. -->
    <div id="boot-shell" role="status" aria-label="Loading YourThikana">
      <style>
        #boot-shell{min-height:100vh;min-height:100svh;box-sizing:border-box;background:#f8fafc;color:#0f172a;padding:20px;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
        #boot-shell .boot-inner{max-width:1120px;margin:0 auto}
        #boot-shell .boot-brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:-.04em;font-size:22px}
        #boot-shell .boot-mark{width:38px;height:38px;border-radius:12px;background:#10b981;color:#022c22;display:grid;place-items:center;font-size:20px}
        #boot-shell .boot-hero{margin:36px auto 0;max-width:820px;text-align:center;border-radius:24px;padding:44px 20px;background:linear-gradient(135deg,#0f172a,#1e293b,#064e3b);color:#fff}
        #boot-shell .boot-kicker{display:inline-block;color:#a7f3d0;background:#065f463d;border:1px solid #34d39966;border-radius:999px;padding:7px 12px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
        #boot-shell h1{font-size:clamp(30px,6vw,48px);line-height:1.12;letter-spacing:-.04em;margin:18px 0 12px;font-weight:900}
        #boot-shell p{max-width:620px;margin:0 auto;color:#cbd5e1;font-size:14px;line-height:1.6}
        #boot-shell .boot-search{height:48px;max-width:560px;margin:24px auto 0;border-radius:14px;background:#fff;color:#64748b;display:flex;align-items:center;padding:0 16px;font-size:13px;text-align:left}
        @media(prefers-reduced-motion:no-preference){#boot-shell .boot-mark{animation:boot-pulse 1.8s ease-in-out infinite}@keyframes boot-pulse{50%{transform:scale(.96);opacity:.85}}}
      </style>
      <div class="boot-inner">
        <div class="boot-brand"><span class="boot-mark" aria-hidden="true">⌂</span><span>THIKANA</span></div>
        <section class="boot-hero">
          <span class="boot-kicker">Northeast India's Direct Stay Portal</span>
          <h1>Find Your Northeast THIKANA</h1>
          <p>Discover hotels, homestays, cottages, hostels, PGs and monthly rooms. Contact local hosts directly on WhatsApp with zero middleman fees.</p>
          <div class="boot-search">⌕ &nbsp; Search by city, property name or state…</div>
        </section>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
